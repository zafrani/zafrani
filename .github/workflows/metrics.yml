# lowlighter/metrics — one composable card: isometric calendar, languages, coding
# habits, lines changed, notable contributions, achievements.
#
# Needs a repo secret named PROFILE_PAT (classic personal access token; `read:user`
# is enough for public data, add `repo` to count private repos too). Until the
# secret exists the render step is skipped and the run stays green.
name: Generate metrics

on:
  schedule:
    - cron: "57 5 * * *" # ~01:57 ET daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROFILE_PAT: ${{ secrets.PROFILE_PAT }}
    steps:
      - name: Check for PROFILE_PAT
        if: env.PROFILE_PAT == ''
        run: echo "::warning::PROFILE_PAT secret not set — skipping metrics render. Add it under Settings → Secrets and variables → Actions."

      - uses: lowlighter/metrics@latest
        if: env.PROFILE_PAT != ''
        with:
          token: ${{ secrets.PROFILE_PAT }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: zafrani
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          config_order: base.header, isocalendar, languages, habits, lines, notable, achievements, base.activity+community, base.repositories, base.metadata

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_lines: yes

          plugin_notable: yes

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
