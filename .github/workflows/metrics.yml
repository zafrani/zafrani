# lowlighter/metrics — one composable card: isometric calendar, languages, lines
# changed, notable contributions. (habits + achievements plugins are disabled: both
# currently crash on GitHub API edge cases and render as error rows.)
#
# Needs a repo secret named PROFILE_PAT (classic personal access token; `read:user`
# is enough for public data, add `repo` to count private repos too). Until the
# secret exists the render step is skipped and the run stays green.
name: Generate metrics

on:
  schedule:
    - cron: "57 5 * * *" # ~01:57 ET daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROFILE_PAT: ${{ secrets.PROFILE_PAT }}
    steps:
      - name: Check for PROFILE_PAT
        if: env.PROFILE_PAT == ''
        run: echo "::warning::PROFILE_PAT secret not set — skipping metrics render. Add it under Settings → Secrets and variables → Actions."

      - uses: lowlighter/metrics@latest
        if: env.PROFILE_PAT != ''
        with:
          token: ${{ secrets.PROFILE_PAT }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: zafrani
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          config_order: base.header, isocalendar, languages, lines, notable, base.activity+community, base.repositories, base.metadata

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          plugin_lines: yes

          plugin_notable: yes
