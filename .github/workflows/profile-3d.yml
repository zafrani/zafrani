# 3D contribution calendar (yoshi389111/github-profile-3d-contrib). Writes a set
# of SVG variants to profile-3d-contrib/ on main; the README picks two of them.
name: Generate 3D contribution calendar

on:
  schedule:
    - cron: "37 5 * * *" # ~01:37 ET daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: refresh 3D contribution calendar"
            git pull --rebase
            git push
          fi
