# Contribution snake (Platane/snk). Renders the contribution graph as an animated
# snake, light + dark, and commits the SVGs to snake/ on main.
name: Generate snake

on:
  schedule:
    - cron: "17 5 * * *" # ~01:17 ET daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/github-snake.svg
            snake/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snake/github-snake.svg snake/github-snake-dark.svg
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: refresh contribution snake"
            git pull --rebase
            git push
          fi
